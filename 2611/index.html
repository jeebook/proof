  <style>
    :root {
      --body_bgcol: #151827;
      --body_col: #ffffff;
      --data_action_col: #ffffff;
      --data_action_bgcol: rgba(0, 0, 0, 0.3);
      --data_action_bxcol: #31384b;
      --second_main_col: #31384b;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      justify-content: center;
      background-color: var(--body_bgcol);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: var(--body_col);
      min-width: 350px;
    }

    .main_container_cl {
      z-index: 1;
      min-width: 250px;
      min-height: 500px;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      padding: 30px 30px 0 20px;
    }

    @media (min-width: 768px) and (max-width: 1023px) {
      .main_container_cl { width: 80%; min-width: 300px; }
    }
    @media (min-width: 1024px) {
      .main_container_cl { min-width: 600px; width: 50%; }
    }
    
    .gap20px_cl {
      height: 15px;
    }

    .section_container_cl {
      flex: 1;
      width: 100%;
      display: flex;
      flex-direction: column;
    }

    .fade-in {
      animation: simpleFade 0.4s ease-in forwards;
    }

    @keyframes simpleFade {
      from { opacity: 0; }
      to { opacity: 1; }
    }
        .load_skeleton_cl {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      z-index: 20;
      background-color: var(--body_bgcol);
      font-family: 'Belanosima', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease; 
    }

    .load_skeleton_text_cl {
      color: white;
      font-size: 22px;
    }
    .load_skeleton_dot_cl:nth-child(1) { animation-delay: 0.2s; }
    .load_skeleton_dot_cl:nth-child(2) { animation-delay: 0.4s; }
    .load_skeleton_dot_cl:nth-child(3) { animation-delay: 0.6s; }

    @keyframes blinkDots {
      0% { opacity: 0.2; }
      20% { opacity: 1; }
      100% { opacity: 0.2; }
    }
    
    .load_skeleton_dot_cl {
      animation: blinkDots 1.4s infinite both;
    }
/*

*/
    
    
    .data_action_skeleton_cl {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      font-family: 'Belanosima', sans-serif;
      z-index: 18;
      display: none;
      opacity: 0;
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease; 
      background-color: var(--data_action_bgcol);
    }
    .data_action_skeleton_box_cl {
      background-color: var(--data_action_bxcol);
      padding: 12px 30px;
      border-radius: 8px;
      color: var(--data_action_col);
      font-size: 20px;
    }
    




/* BULLETIN PAGE */
    .bulletin_page_cl {
      display: none; /* Keep only this display property here */
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 100vw;
      z-index: 19;
      background-color: var(--body_bgcol);
      justify-content: center;
      align-items: center;
      transition: opacity 0.3s ease;
    }
    
.bulletin_text_cl {
      color: var(--body_col);
      font-size: 22px;
      font-family: 'Belanosima', sans-serif;
      border: 2px solid var(--second_main_col);
      padding: 20px 40px;
      border-radius: 8px;
      
      /* Mobile default */
      width: 75%; 
      text-align: center;
      word-wrap: break-word; /* Ensures long unbroken text doesn't overflow the box */
    }

    /* Tablet widths */
    @media (min-width: 768px) and (max-width: 1023px) { 
      .bulletin_text_cl { 
        width: 80%; 
        max-width: 450px; 
      } 
    }
    
    /* Desktop widths */
    @media (min-width: 1024px) { 
      .bulletin_text_cl { 
        width: 50%; 
        max-width: 550px; 
      } 
    }
:root {
  --bal-info-bg: #141a2a;
  --bal-info-border: #1b2137;
  --bal-info-shadow: #31384b;
  --success-color: #28c76f;
  --success-icon-color: #ffffff;
  --user-info-text-color: #d1d1db;
}

.bal_info_container_cl {
  background-color: var(--bal-info-bg);
  min-height: 200px;
  width: 100%;
  border-radius: 20px;
  border: 5px solid var(--bal-info-border);
  box-shadow: 0 0 0 1px var(--bal-info-shadow);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.success_icon_cl {
  width: 35px;
  height: 35px;
  background-color: var(--success-color);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  margin-bottom: 20px;
  color: var(--success-icon-color);
  position: relative;
  z-index: 1;
}

.success_icon_cl svg {
  width: 20px;
  height: 20px;
}

.user_infotext_cl {
  font-size: 15px;
  color: var(--user-info-text-color);
  margin-bottom: 8px;
  letter-spacing: 0.3px;
}

.amount_text_cl {
  font-size: 30px;
  font-weight: 500;
  margin: 0;
  margin-bottom: 5px;
  letter-spacing: 1px;
}

.success_icon_cl::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: var(--success-color);
  border-radius: 50%;
  z-index: -1;
  opacity: 0;
}

.success_icon_cl.animate-wave::after {
  animation: wave-animation 2s infinite ease-out;
}

@keyframes wave-animation {
  0% {
    transform: scale(1);
    opacity: 0.7;
  }
  100% {
    transform: scale(2.2);
    opacity: 0;
  }
}

        /* Wave setup (Animation removed from here) */
        .success_icon_cl::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #28c76f;
            border-radius: 50%;
            z-index: -1; 
            opacity: 0; /* Hidden by default */
        }

        /* Class to trigger the animation */
        .success_icon_cl.animate-wave::after {
            animation: wave-animation 2s infinite ease-out; 
        }

        /* Wave Keyframes */
        @keyframes wave-animation {
            0% {
                transform: scale(1);
                opacity: 0.7; 
            }
            100% {
                transform: scale(2.2); 
                opacity: 0; 
            }
        }
:root {
  --over-btn-textcol: #ffffff;
  --avail-btn-bgcol: #1e2238;
  --avail-btn-bordercol: #2a2f4c;
  --avail-btn-shadow: rgba(0, 0, 0, 0.35);
  --btn-item-textcol: #8f9bba;
  --magic-indicator-bgcol: #6366f1;
  --magic-indicator-shadow: rgba(99, 102, 241, 0.45);
  --btn-clone-textcol: #ffffff;
}

.over_available_buttons_cl {
  display: flex;
  color: var(--over-btn-textcol);
  width: 100%;
  margin: 0;
}

.available_buttons_cl {
  position: relative;
  display: inline-flex;
  background-color: var(--avail-btn-bgcol);
  border: 1px solid var(--avail-btn-bordercol);
  border-radius: 30px;
  padding: 4px;
  height: fit-content;
  user-select: none;
  box-shadow: 0 8px 24px var(--avail-btn-shadow);
}

.button_item {
  position: relative;
  padding: 10px 0;
  width: 90px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  color: var(--btn-item-textcol);
  text-align: center;
  -webkit-tap-highlight-color: transparent;
  outline: none;
  z-index: 1;
  white-space: nowrap;
}

.magic_indicator {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 90px;
  height: calc(100% - 8px);
  background-color: var(--magic-indicator-bgcol);
  border-radius: 25px;
  overflow: hidden;
  pointer-events: none;
  z-index: 2;
  box-shadow: 0 2px 10px var(--magic-indicator-shadow);
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

.indicator_text_wrapper {
  position: absolute;
  top: 0;
  left: 0;
  display: inline-flex;
  height: 100%;
  transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
}

.indicator_text_wrapper .button_clone {
  padding: 10px 0;
  width: 90px;
  font-size: 14px;
  font-weight: 700;
  color: var(--btn-clone-textcol);
  text-align: center;
  white-space: nowrap;
}
:root {
  --upload-border-top: #333333;
  --upload-drag-border: #2563eb;
  --upload-drag-bg: rgba(37, 99, 235, 0.05);
  --upload-icon-color: #94a3b8;
  --selection-title-color: #e2e8f0;
  --selection-subtitle-color: #64748b;
  --selection-subtitle-span-color: #94a3b8;
  --btn-bg: #1e293b;
  --btn-text: #e2e8f0;
  --btn-hover-bg: #334155;
  --btn-primary-bg: #2563eb;
  --btn-primary-text: #ffffff;
  --btn-primary-hover-bg: #1d4ed8;
  --icon-btn-text: #94a3b8;
  --icon-btn-hover-text: #e2e8f0;
  --wave-shadow-start: rgba(37, 99, 235, 0.7);
  --wave-shadow-end: rgba(37, 99, 235, 0);
  --progress-dot-bg: #334155;
  --progress-line-bg: #334155;
  --progress-active-bg: #2563eb;
  --alert-bg: #ef4444;
  --alert-text: #ffffff;
  --alert-shadow: rgba(0, 0, 0, 0.5);
  --loading-clock-color: #64748b;
}

.upload_prof_container_cl {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 400px;
  width: 100%;
  flex: 1;
  text-align: center;
  box-sizing: border-box;
  border-top: 2px solid var(--upload-border-top);
  border-radius: 12px;
  border: 2px dashed transparent;
  transition: border-color 0.3s, background-color 0.3s;
}

.img_selection_drop_container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
  padding: 20px;
  box-sizing: border-box;
}

.upload_prof_container_cl.drag_active {
  border-color: var(--upload-drag-border);
  background-color: var(--upload-drag-bg);
}

#img_selection_upload_icon {
  width: 40px;
  height: 40px;
  margin-bottom: 16px;
  color: var(--upload-icon-color);
}

.img_selection_title {
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 6px;
  color: var(--selection-title-color);
}

.img_selection_subtitle {
  font-size: 12px;
  margin-bottom: 24px;
  color: var(--selection-subtitle-color);
}

.img_selection_subtitle span {
  font-weight: 700;
  color: var(--selection-subtitle-span-color);
}

.img_selection_btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: var(--btn-bg);
  color: var(--btn-text);
  border: none;
  border-radius: 50px;
  font-size: 13px;
  font-weight: 500;
  padding: 10px 20px;
  cursor: pointer;
  transition: background-color 0.2s, opacity 0.2s;
  outline: none;
}

.img_selection_btn:hover:not(:disabled) {
  background-color: var(--btn-hover-bg);
}

.img_selection_btn svg {
  width: 16px;
  height: 16px;
  margin-right: 8px;
}

@keyframes float_bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-12px); }
}

.upload_prof_container_cl.drag_active #img_selection_upload_icon {
  animation: float_bounce 0.8s ease-in-out infinite;
}

.img_selection_btn_primary {
  background-color: var(--btn-primary-bg);
  color: var(--btn-primary-text);
  font-size: 15px;
  font-weight: 600;
  padding: 12px;
  width: 100%;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: background-color 0.2s;
}

.img_selection_btn_primary:hover:not(:disabled) {
  background-color: var(--btn-primary-hover-bg);
}

.img_selection_hidden {
  display: none !important;
}

.dot {
  width: 14px;
  height: 14px;
  background-color: var(--progress-dot-bg);
  border-radius: 50%;
  transition: background-color 0.3s ease;
  flex-shrink: 0;
}

.line {
  flex: 1;
  height: 3px;
  background-color: var(--progress-line-bg);
  position: relative;
  margin: 0 4px;
  border-radius: 2px;
}

.line::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  height: 100%;
  width: 0;
  background-color: var(--progress-active-bg);
  transition: width 0.8s ease-in-out;
  border-radius: 2px;
}

.line.done::after {
  width: 100%;
}

.dot.done {
  background-color: var(--progress-active-bg);
}

.dot.wave {
  background-color: var(--progress-active-bg);
  animation: fadeWave 1.5s infinite;
}

@keyframes clock_spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

.clock-hand {
  transform-origin: 12px 12px;
  animation: clock_spin 4s linear infinite;
}

@keyframes fadeWave {
  0% { box-shadow: 0 0 0 0 var(--wave-shadow-start); }
  70% { box-shadow: 0 0 0 10px var(--wave-shadow-end); }
  100% { box-shadow: 0 0 0 0 var(--wave-shadow-end); }
}

#img_selection_alert_box {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  background-color: var(--alert-bg);
  color: var(--alert-text);
  padding: 12px 24px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  z-index: 100;
  box-shadow: 0 4px 12px var(--alert-shadow);
  transition: opacity 0.3s ease;
}
:root {
  --badge-confirmed-bg: #c9f0d4;
  --badge-confirmed-text: #0e6333;
  --badge-pending-bg: #424242;
  --badge-pending-text: #e0e0e0;
  --badge-canceled-bg: #4a1919;
  --badge-canceled-text: #ff8a80;
  --badge-purchased-bg: #103154;
  --badge-purchased-text: #82b1ff;
  --text-main: #f5f5f5;
  --text-muted: #9aa0a6;
  --border-color: #333333;
}

.bal_history_container_cl {
  display: flex;
  flex-direction: column;
  min-height: 400px;
  color: white;
  flex: 1;
  width: 100%;
}

.card {
  display: flex;
  align-items: stretch;
  gap: 16px;
  padding: 20px 0;
  border-bottom: 1px solid var(--border-color);
  opacity: 0;
  transform: translateY(-20px);
}

.card:last-child {
  border-bottom: none;
}

.card.animate-in {
  display: flex;
  animation: slideDownFade 0.4s ease forwards;
}

@keyframes slideDownFade {
  0% {
    opacity: 0;
    transform: translateY(-30px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.card-img {
  width: 75px;
  height: 75px;
  border-radius: 8px;
  object-fit: cover;
  background-color: #2a2a2a;
  border: 2px solid var(--border-color);
  cursor: pointer;
  transition: opacity 0.2s;
  outline: none;
}

.card-img:hover {
  opacity: 0.5;
}

.card-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  min-height: 75px;
}

.card-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.card-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.utr-label {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-main);
  text-transform: capitalize;
}

.utr-number {
  font-size: 15px;
  color: var(--text-muted);
}

.date-row {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 14px;
  color: var(--text-muted);
  line-height: 1;
}

.date-row svg {
  width: 16px;
  height: 16px;
  fill: var(--text-muted);
}

.amount {
  font-size: 24px;
  font-weight: 700;
  color: var(--text-main);
  line-height: 1;
}

.clock-icon {
  width: 25px;
  height: 25px;
  fill: var(--text-main);
  transform-origin: center;
  animation: fa-jello 2s ease-in-out infinite; 
}
        /* Font Awesome's actual squish/stretch Jello math */
        @keyframes fa-jello {
            0% {
                transform: scale(1, 1);
            }
            12% {
                transform: scale(1.15, 0.85);
            }
            24% {
                transform: scale(0.85, 1.15);
            }
            36% {
                transform: scale(1.05, 0.95);
            }
            48% {
                transform: scale(0.95, 1.05);
            }
            60% {
                transform: scale(1.02, 0.98);
            }
            72% {
                transform: scale(0.98, 1.02);
            }
            100% {
                transform: scale(1, 1);
            }
        }
.badge {
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.2;
}

.badge.confirmed {
  background-color: var(--badge-confirmed-bg);
  color: var(--badge-confirmed-text);
}

.badge.pending {
  background-color: var(--badge-pending-bg);
  color: var(--badge-pending-text);
}

.badge.canceled {
  background-color: var(--badge-canceled-bg);
  color: var(--badge-canceled-text);
}

.badge.purchased {
  background-color: var(--badge-purchased-bg);
  color: var(--badge-purchased-text);
}

/* Modal */
.img_preview_cl {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0, 0, 0, 0.7);
  z-index: 100;
  justify-content: center;
  align-items: center;
}

.img_preview_cl.active {
  display: flex;
}

.img_preview_content_cl {
  position: relative;
  max-width: 90%;
  max-height: 90%;
}

.full_img_preview_cl {
  max-width: 70vw;
  max-height: 70vh;
  object-fit: contain;
  border-radius: 8px;
  border: 2px solid var(--border-color);
}

.close_img_preview_btn {
  position: absolute;
  top: -35px;
  right: 0;
  background: none;
  border: none;
  color: var(--text-main);
  font-size: 32px;
  cursor: pointer;
  line-height: 1;
}
  </style>
</head>

async function upload_img() {
  if (!selectedFile || isUploading) return;
  isUploading = true;
  // data action
  active_data_action_skeleton_fc("Uploading");

  const uploadBtn = document.getElementById('img_selection_upload_btn');
  const progressContainer = document.getElementById('progressContainer');
  const clock = document.getElementById('img_selection_loading_clock');

  if (uploadBtn) uploadBtn.style.display = 'none';
  if (progressContainer) progressContainer.style.display = 'flex';
  if (clock) clock.classList.remove('img_selection_hidden');

  const dot1 = document.getElementById('dot1'); 
  const line1 = document.getElementById('line1');
  const dot2 = document.getElementById('dot2'); 
  const line2 = document.getElementById('line2');
  
  const dot3 = document.getElementById('dot3');
  const line3 = document.getElementById('line3');
  const dot4 = document.getElementById('dot4');

  try {
    // Step 1: Client-side WebP conversion (<= 100KB)
    dot1.classList.add('wave');
    const webpBlob = await convertToWebP(selectedFile, 100);
    dot1.classList.replace('wave', 'done');
    line1.classList.add('done');
    await sleep(500);

    // Step 2: Fetch ImageKit Auth Parameters (token, signature, expire)
    dot2.classList.add('wave');
    const authResponse = await fetch("https://ozxvulrbqxkvivvvupsn.supabase.co/functions/v1/eze_pay_imgkit_auth");

    if (!authResponse.ok) {
      throw new Error("Failed to get ImageKit upload authorization.");
    }
    const authData = await authResponse.json();


    // Step 3: Direct Upload to ImageKit API
    const originalName = selectedFile.name.split('.')[0] || 'receipt';
    const finalFileName = `Eze_${user_info.user_id}_${authData.file_time}.webp`;

    const ikFormData = new FormData();
    ikFormData.append("file", webpBlob, finalFileName);
    ikFormData.append("fileName", finalFileName);
    ikFormData.append("useUniqueFileName", "false"); // Uncommented so it uses the EXACT name
    ikFormData.append("token", authData.token);
    ikFormData.append("signature", authData.signature);
    ikFormData.append("expire", authData.expire);
    ikFormData.append("publicKey", authData.publicKey || "public_3wW6Pk+NXgGx4DvS0VEvHu2HCT8=");
    ikFormData.append("folder", authData.path);
    
    const myMetadata = {
    "user_id": String(user_info.user_id),
    "webhook_url": user_info.day_hook,
    "action_type": "payment_prof"};
    ikFormData.append("customMetadata", JSON.stringify(myMetadata));

    const ikResponse = await fetch("https://upload.imagekit.io/api/v1/files/upload", {
      method: "POST",
      body: ikFormData
    });

    const ikResult = await ikResponse.json();
    if (!ikResponse.ok) {
      throw new Error(ikResult.message || "ImageKit upload failed.");
    }

    // Step 5: Complete Progress UI
    dot2.classList.replace('wave', 'done');
    line2.classList.add('done');
    dot3.classList.add('wave');
    dot3.classList.add('done');

    
    selectedFile = null;
    //show_img_selection_alert("Don't close.", false);
    active_data_action_skeleton_fc("wait (10s)");

  } catch (error) {
    isUploading = false;
    if (clock) clock.classList.add('img_selection_hidden');
    show_img_selection_alert("Try Again!", true);
    remove_data_action_skeleton_fc();

    setTimeout(() => {
      if (progressContainer) progressContainer.style.display = 'none';
      if (uploadBtn) {
        uploadBtn.style.display = 'block';
        uploadBtn.textContent = "Retry Upload";
      }
    }, 2000);
  }
}
// ====== 5. WEBP CONVERTER ======
function convertToWebP(file, maxKbSize) {
  return new Promise((resolve, reject) => {
    if (file.type === 'image/webp' && file.size <= maxKbSize * 1024) {
      return resolve(file);
    }
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let width = img.width;
      let height = img.height;
      const MAX_DIMENSION = 1920;

      if (width > MAX_DIMENSION || height > MAX_DIMENSION) {
        const ratio = Math.min(MAX_DIMENSION / width, MAX_DIMENSION / height);
        width = Math.round(width * ratio);
        height = Math.round(height * ratio);
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, width, height);

      const attemptCompression = (quality) => {
        canvas.toBlob((blob) => {
          if (!blob) return reject(new Error("Canvas conversion failed."));
          if (blob.size <= maxKbSize * 1024 || quality <= 0.1) {
            resolve(blob);
          } else {
            attemptCompression(quality - 0.1);
          }
        }, 'image/webp', quality);
      };
      attemptCompression(0.90);
    };
    img.onerror = () => reject(new Error("Failed to load image."));
    img.src = URL.createObjectURL(file);
  });
}

            ${formatDate(item.date_time)}
          </div>
          <div class="badge ${badgeClass}">${badgeText}</div>
        </div>
      </div>
    </div>`;
}

function render_history_section() {
    const mainContainer = document.getElementById("section_container_id");
    if (!mainContainer) return;
    
    try {
        const historyData = user_data?.payment_history;
        const hasPadding = historyData?.of_padding && historyData.of_padding.length > 0;
        const hasConfirmed = historyData?.of_confirmed && Object.keys(historyData.of_confirmed).length > 0;
        
        if (!historyData || (!hasPadding && !hasConfirmed)) {
            mainContainer.innerHTML = `
        <div class="fade-in" style="display: flex; flex: 1; justify-content: center; align-items: center; min-height: 400px; color: var(--text-muted, #9aa0a6); font-size: 16px;">
          No history
        </div>
      `;
            return;
        }
        
        mainContainer.innerHTML = `
      <div class="bal_history_container_cl fade-in" id="bal_history_container_id">
        <div id="history_cards_wrapper" style="width: 100%;"></div>
      </div>
    `;
        renderHistoryHTML();
    } catch (error) {
        mainContainer.innerHTML = `
      <div class="fade-in" style="display: flex; flex: 1; justify-content: center; align-items: center; min-height: 400px; color: var(--text-muted, #9aa0a6); font-size: 16px;">
        No history
      </div>
    `;
    }
}

function renderHistoryHTML() {
    const container = document.getElementById('history_cards_wrapper');
    if (!container) return;
    
    let html = '';
    const historyData = user_data.payment_history;
    
    const paddingItems = historyData.of_padding || [];
    paddingItems.forEach(item => { html += createCardHTML(item); });
    
    const confirmedData = historyData.of_confirmed || {};
    const recentItems = confirmedData.recent_first || [];
    recentItems.forEach(item => { html += createCardHTML(item); });
    
    const listIndex = confirmedData.list_index || 0;
    for (let i = listIndex; i >= 1; i--) {
        const listKey = `list_${i}`;
        const currentList = confirmedData[listKey] || [];
        currentList.forEach(item => { html += createCardHTML(item); });
    }
    
    container.innerHTML = html;
    show_history_cards();
}

function show_history_cards() {
    const cards = document.querySelectorAll('.card');
    cards.forEach((card, index) => {
        card.classList.remove('animate-in');
        card.style.display = 'flex';
        void card.offsetWidth;
        card.style.animationDelay = `${index * 0.1}s`;
        card.classList.add('animate-in');
    });
}

function open_img_preview(imgSrc) {
    const modal = document.getElementById('img_preview_id');
    const fullImg = document.getElementById('full_img_preview_id');
    if (modal && fullImg) {
        fullImg.src = imgSrc;
        modal.classList.add('active');
    }
}

function close_img_preview(event) {
    if (event) event.stopPropagation();
    const modal = document.getElementById('img_preview_id');
    const fullImg = document.getElementById('full_img_preview_id');
    if (modal && fullImg) {
        modal.classList.remove('active');
        fullImg.src = '';
    }
}
    run_on_load_html_fc();
  </script>
</body>
</html>
